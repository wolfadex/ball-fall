<!doctype html>
<html lang="en">
    <head>
        <title>Ball Fall</title>

        <link rel="stylesheet" href="styles.css" />

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>
    <body>
        <script src="elm.js"></script>
        <script>
            const sounds = {};
            for (const sound of ["goal_made", "ball_hit", "menu_select"]) {
                sounds[sound] = new Audio(`assets/audio/${sound}.mp3`);
                sounds[sound].load();
            }
            const tracks = {};
            for (const track of ["song_1", "song_2"]) {
                tracks[track] = new Audio(`assets/audio/${track}.mp3`);
                tracks[track].load();
            }
            const playingTracks = {};

            const app = Elm.Main.init({
                flags: {
                    initialSeed: Date.now(),
                    width: Math.floor(window.innerWidth),
                    height: Math.floor(window.innerHeight),
                },
            });

            app.ports.playSound.subscribe(function ({ sound, volume }) {
                const localNode = sounds[sound].cloneNode(true);
                localNode.volume = volume;
                localNode.play();
            });
            app.ports.startMusic.subscribe(function ({ track, volume }) {
                if (!playingTracks[track]) {
                    playingTracks[track] = tracks[track].cloneNode(true);
                    playingTracks[track].loop = true;
                }
                playingTracks[track].volume = volume;
                playingTracks[track].play();
            });
            // app.ports.stoptMusic.subscribe(function ({ track, volume }) {
            //     if (playingTracks[track]) {
            //         playingTracks[track].stop();
            //     }
            // });
        </script>
    </body>
</html>

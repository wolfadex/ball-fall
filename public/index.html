<!doctype html>
<html lang="en">
    <head>
        <title>Ball Fall</title>

        <link rel="stylesheet" href="styles.css" />

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>
    <body>
        <script src="elm.js"></script>
        <script>
            const sounds = {};
            for (const sound of ["goal_made", "ball_hit", "menu_select"]) {
                sounds[sound] = new Audio(`assets/audio/${sound}.mp3`);
                sounds[sound].load();
            }
            const tracks = {};
            for (const track of ["song_1", "song_2"]) {
                tracks[track] = new Audio(`assets/audio/${track}.mp3`);
                tracks[track].load();
            }
            const playingTracks = {};

            const defaultSettings = {
                musicEnabled: true,
                soundEffectsEnabled: true,
                musicVolume: 1.0,
                soundEffectsVolume: 1.0,
                tiltControlsEnabled: true,
            };
            let savedSettings = {
                ...defaultSettings,
                ...(JSON.parse(localStorage.getItem("settings")) ||
                    defaultSettings),
            };

            const app = Elm.Main.init({
                flags: {
                    initialSeed: Date.now(),
                    width: Math.floor(window.innerWidth),
                    height: Math.floor(window.innerHeight),
                    savedSettings: savedSettings,
                    bestScore: localStorage.getItem("score"),
                    tiltSupported: window.DeviceOrientationEvent != null,
                },
            });

            app.ports.saveScore.subscribe(function (newBestScore) {
                localStorage.setItem("score", JSON.stringify(newBestScore));
            });

            app.ports.saveSettings.subscribe(function (settings) {
                if (!settings.musicEnabled && savedSettings.musicEnabled) {
                    for (const track of Object.values(playingTracks)) {
                        track.audio.pause();
                    }
                }

                savedSettings = settings;
                localStorage.setItem("settings", JSON.stringify(settings));
            });

            app.ports.playSound.subscribe(function ({ sound, volume }) {
                if (savedSettings.soundEffectsEnabled) {
                    const localNode = sounds[sound].cloneNode(true);
                    localNode.volume =
                        volume * savedSettings.soundEffectsVolume;
                    localNode.play();
                }
            });
            app.ports.startMusic.subscribe(function ({ track, volume }) {
                if (savedSettings.musicEnabled) {
                    if (!playingTracks[track]) {
                        playingTracks[track] = {
                            audio: tracks[track].cloneNode(true),
                            baseVolume: volume,
                        };
                        playingTracks[track].audio.loop = true;
                    }
                    playingTracks[track].baseVolume = volume;
                    playingTracks[track].audio.volume =
                        volume * savedSettings.musicVolume;
                    playingTracks[track].audio.play();
                }
            });
            app.ports.musicVolumeSet.subscribe(function (volume) {
                for (const track of Object.values(playingTracks)) {
                    track.audio.volume = track.baseVolume * volume;
                }
            });
            app.ports.stopMusic.subscribe(function (track) {
                if (playingTracks[track]) {
                    playingTracks[track].audio.pause();
                }
            });
            app.ports.resumeMusic.subscribe(function (track) {
                if (playingTracks[track]) {
                    playingTracks[track].audio.play();
                }
            });

            window.addEventListener(
                "deviceorientation",
                (event) => {
                    const rotateDegrees = event.alpha; // alpha: rotation around z-axis
                    const leftToRight = event.gamma; // gamma: left to right
                    const frontToBack = event.beta; // beta: front back motion

                    app.ports.deviceOrientationEvent.send({
                        pitch: event.beta,
                        yaw: event.alpha,
                        roll: event.gamma,
                    });
                },
                true,
            );
        </script>
    </body>
</html>

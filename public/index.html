<!doctype html>
<html lang="en">
    <head>
        <title>Ball Fall</title>

        <link rel="stylesheet" href="styles.css" />

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>
    <body>
        <script src="elm.js"></script>
        <script>
            const audio = {};
            for (const sound of ["goal_made", "ball_hit"]) {
                audio[sound] = new Audio(`assets/audio/${sound}.mp3`);
                audio[sound].load();
            }

            const app = Elm.Main.init({
                flags: {
                    initialSeed: Date.now(),
                    width: Math.floor(window.innerWidth),
                    height: Math.floor(window.innerHeight),
                },
            });

            app.ports.playSound.subscribe(function ({ sound, volume }) {
                const localNode = audio[sound].cloneNode(true);
                localNode.volume = volume;
                localNode.play();
            });
        </script>
    </body>
</html>

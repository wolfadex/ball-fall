<!doctype html>
<html lang="en">
    <head>
        <title>Ball Fall</title>

        <link rel="stylesheet" href="styles.css" />

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>
    <body>
        <script src="elm.js"></script>
        <script>
            const audio = {};

            audio["wood_hit"] = new Audio("assets/audio/wood_hit/wood-hit.wav");
            audio["wood_hit"].volume = 1;
            audio["wood_hit"].load();

            const app = Elm.Main.init({
                flags: {
                    initialSeed: Date.now(),
                    width: Math.floor(window.innerWidth),
                    height: Math.floor(window.innerHeight),
                },
            });

            app.ports.playSound.subscribe(function ({ sound }) {
                audio[sound].cloneNode(true).play();
            });
        </script>
    </body>
</html>
